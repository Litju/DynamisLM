# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: true
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []

  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: off
    title:
      mode: warning
      requirements: >-
        The title must identify the Linear mission when one exists, use a concise
        imperative or semantic description, and must not hide unrelated scope.
    description:
      mode: warning
    issue_assessment:
      mode: warning

  tools:
    github-checks:
      enabled: true
    ruff:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true

  path_instructions:
    - path: "src/dynamislm/ingestion/**"
      instructions: |
        Review this code as an adversarial evidence and authority boundary.
        Flag caller-controlled authority, self-consistent but ungrounded evidence,
        source/version/license/representation cross-binding, registry/receipt/raw/
        canonical/validation substitution, fail-open defaults, path traversal,
        symlink escape, TOCTOU, and replay claims stronger than executable evidence.
        Require promotion to fail closed when an authority edge is missing. Do not
        treat names such as verified, registered, qualified, canonical, or receipt
        as proof. Do not invent provider semantics.

    - path: "src/dynamislm/measurement/**"
      instructions: |
        Treat measurement definitions as scientific contracts. Check measurement
        identity, dimensions and units, sign conventions, direct versus derived
        versus provider-derived classification, acquisition and processing identity,
        provenance, and silent semantic compatibility changes. Do not allow values
        to acquire stronger scientific meaning than their evidence supports. Do not
        invent unavailable device or algorithm metadata.

    - path: "src/dynamislm/population/**"
      instructions: |
        Require the exact target population and evidence-bound dimensions. Flag
        silent cohort broadening, unresolved dimensions promoted by defaults,
        caller-supplied qualification states, and source/population cross-binding.
        Do not promote unresolved sex, age class, professional status, squad level,
        sport, or competition tier without evidence for the exact asserted dimension.

    - path: "src/dynamislm/football/**"
      instructions: |
        Flag invented fixture, opponent, match, or session context; season identity
        drift; session identity drift; and football context presented as source-
        supported when it is only inferred. Keep supported and inferred context
        distinct and fail closed when identity is unavailable.

    - path: "src/dynamislm/provenance/**"
      instructions: |
        Treat provenance as an identity-bearing graph. Flag broken lineage,
        unbound artifacts, caller-asserted provenance, source/version mismatches,
        processing outputs without exact input and method identity, and evidence
        claims not tied to the exact object they describe.

    - path: "src/dynamislm/comparability/**"
      instructions: |
        Require fail-closed comparability and explicit applicability boundaries.
        Flag cross-source identity collapse and unsupported scientific equivalence.
        Do not infer comparability merely from matching labels, shapes, units, or
        successful parsing.

    - path: "src/dynamislm/evidence/**"
      instructions: |
        Require evidence to support the exact claim, object, population, source,
        and version asserted. Flag missing evidence, cross-source identity drift,
        fail-open qualification, and unsupported causal or scientific equivalence.
        Do not invent unavailable provider semantics.

    - path: "src/dynamislm/longitudinal/**"
      instructions: |
        Check fail-closed comparability, applicability boundaries, cross-source
        identity, and unsupported causal or scientific equivalence across time.
        Flag transitions that silently change measurement, population, session, or
        provenance meaning.

    - path: "registries/**"
      instructions: |
        Treat registry metadata as authority-bearing. Scrutinize hashes, versions,
        file IDs and PIDs, licenses, representations, schema hashes, canonical
        hashes and counts, mapping versions, qualification state, and expected
        values. Flag rewrites that appear intended only to make tests pass. Real
        empirical rows must not be committed here.

    - path: "reports/**"
      instructions: |
        Require every report claim to be mechanically supported by repository
        evidence. A committed report does not become scientific or merge authority
        merely because it is present in Git. Flag stronger claims than the code,
        tests, or evidence establish.

    - path: "scripts/**"
      instructions: |
        Check deterministic behavior, subprocess safety, filesystem containment,
        mutation boundaries, replay parity, and absence of shell=True where argument
        arrays suffice. Flag scripts that mutate authority or silently rewrite
        expected evidence.

    - path: "tests/**"
      instructions: |
        Treat tests as independent falsification attempts. Require adversarial
        negative tests for authority boundaries. Flag tests that mock away the
        boundary, merely reproduce production assumptions, cover only happy paths,
        or rewrite expected values to obtain PASS.

    - path: ".github/**"
      instructions: |
        Treat GitHub automation and governance as merge-authority infrastructure.
        Flag mutable Action pins, excessive token permissions, pull_request_target,
        credential persistence, CI bypasses, and silent weakening of ruleset
        assumptions. Preserve immutable pins and minimum permissions.

    - path: "docs/decisions/**"
      instructions: |
        Compare documentation claims with executable behavior and evidence. Flag
        claims of stronger verification, security, provenance, scientific authority,
        or replayability than the repository proves. Keep limitations explicit.

    - path: "docs/operations/**"
      instructions: |
        Verify commands, states, branch rules, and review procedures are current
        and executable. Flag stale commands, unverifiable PASS claims, or steps
        that bypass deterministic repository authority.

    - path: "pyproject.toml"
      instructions: |
        Dependency changes require an explicit mission-relevant justification. Flag
        unexplained dependency expansion, authority changes hidden in tooling, and
        configuration that weakens deterministic QA.

    - path: "uv.lock"
      instructions: |
        Treat lockfile drift as authority-relevant. Require every lockfile change
        to correspond to an intentional, justified dependency change; flag silent
        resolver or version drift.

knowledge_base:
  automatic_linking_mode: disabled
  mcp:
    usage: disabled
  linear:
    usage: enabled
    team_keys:
      - RES
  learnings:
    scope: local
    approval_delay: 30
