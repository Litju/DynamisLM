name: RES-419 temporary pinned tokenizer report reproduction
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/res419_tokenizer_probe.py"
      - ".github/workflows/res419-temp-report.yml"
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.2"
          enable-cache: "false"
      - name: Emit fresh pinned tokenizer report
        run: |
          uv run --no-project --python 3.12 --with tokenizers==0.22.1 python scripts/res419_tokenizer_probe.py --output /tmp/res419_tokenizer_probe.json
          echo RES419_JSON_BEGIN
          cat /tmp/res419_tokenizer_probe.json
          echo RES419_JSON_END
          sha256sum /tmp/res419_tokenizer_probe.json
